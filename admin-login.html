<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 移昇海外</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background: linear-gradient(135deg, #1a3a5c, #0d1b2a); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box { background:#fff; padding:50px 40px; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.3); width:100%; max-width:400px; }
.login-box h2 { font-size:26px; color:#1a3a5c; text-align:center; margin-bottom:30px; }
.form-group { margin-bottom:20px; }
.form-group label { display:block; font-size:14px; color:#333; margin-bottom:8px; font-weight:500; }
.form-group input { width:100%; padding:12px 15px; border:1px solid #e0e0e0; border-radius:8px; font-size:15px; }
.form-group input:focus { outline:none; border-color:#c0953a; }
.btn { width:100%; padding:14px; background:#c0953a; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:500; cursor:pointer; transition:0.3s; }
.btn:hover { background:#a0782e; }
.error { color:#e74c3c; font-size:13px; margin-top:5px; display:none; }
.back-link { text-align:center; margin-top:20px; font-size:14px; }
.back-link a { color:#1a3a5c; text-decoration:none; }
.back-link a:hover { color:#c0953a; }
</style>
</head>
<body>
<div class="login-box">
  <h2>🔐 管理后台登录</h2>
  <form onsubmit="return login(event)">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <div class="error" id="error">用户名或密码错误</div>
    <button type="submit" class="btn">登录</button>
  </form>
  <div class="back-link"><a href="index.html">← 返回网站首页</a></div>
</div>
<script>
function login(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  // 默认账号: admin / admin123
  if (u === 'admin' && p === 'admin123') {
    localStorage.setItem('immigration_admin', 'true');
    window.location.href = 'admin.html';
  } else {
    document.getElementById('error').style.display = 'block';
  }
  return false;
}
</script>
</body>
</html>
